<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Match all pairs."><title>Memory Match — Game Dot G</title><link rel="stylesheet" href="../assets/style.css"></head><body><header><b>GAME <i>DOT G</i></b><a href="../index.html">← Games</a></header><main class="game"><small>PUZZLE</small><h1>Memory Match</h1><p>Match all pairs.</p><div class="ad">ADVERTISEMENT</div><div class="memgrid" id="g"></div><button id="r">New Game</button><script>let v=["🍎","🚀","🐱","⚽","🍎","🚀","🐱","⚽"],first=null,lock=0,win=0;function init(){g.innerHTML=[...v].sort(()=>Math.random()-.5).map(x=>`<button class="mem">?</button>`).join("");document.querySelectorAll(".mem").forEach((b,i)=>b.onclick=()=>{if(lock||b.textContent!="?")return;b.textContent=v[i];if(!first)first=b;else{if(first.textContent==b.textContent){win+=2;first=null;if(win==v.length)alert("You won!")}else{lock=1;setTimeout(()=>{first.textContent=b.textContent="?";b.textContent="?";first=null;lock=0},500)}}})}r.onclick=init;init()</script><div class="ad">ADVERTISEMENT</div></main><footer>© 2026 Game Dot G</footer></body></html>
